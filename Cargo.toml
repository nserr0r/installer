[package]
name = "moonshine-install"
version = "0.1.0"
edition = "2024"
description = "Установщик для Moonshine"
license = "Apache-2.0"

[[bin]]
name = "moonshine-install"
path = "src/main.rs"

[dependencies]
rpassword = { version = "*" }
uuid = { version = "*", features = ["fast-rng", "serde", "v4"] }
ratatui = { version = "0.30" }
toml = "1.1.8"
