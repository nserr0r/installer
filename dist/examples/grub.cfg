# Пункты меню GRUB установочного носителя.
menuentry 'Установка Moonshine (конфиг по сети)' {
    linux /vmlinuz moonshine.config=https://evillin.online/moonshine.toml moonshine.yes=1 ip=dhcp
    initrd /moonshine-installer.img
}

menuentry 'Установка Moonshine (мастер на консоли)' {
    linux /vmlinuz moonshine.wizard=1
    initrd /moonshine-installer.img
}
